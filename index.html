<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QCO - Quiz Competition Organization</title>

<meta name="description"
content="QCO - Quiz Competition Organization. Learn, Compete, Achieve.">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;

    background:#f5f7fb;
    color:#172033;
    line-height:1.6;
}

a{
    text-decoration:none;
}

img{
    max-width:100%;
}


/* =========================
   HEADER / NAVBAR
========================= */

.header{
    position:sticky;
    top:0;
    z-index:9999;

    background:rgba(5,20,52,.96);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 5px 25px rgba(0,0,0,.15);
}

.navbar{
    width:100%;
    max-width:1250px;

    margin:auto;

    min-height:72px;

    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}


/* BRAND */

.brand{
    color:#ffffff;

    font-size:21px;
    font-weight:800;

    letter-spacing:.3px;

    display:flex;
    align-items:center;

    white-space:nowrap;
}

.brand-qco{
    color:#ffd34e;
    font-size:26px;
    margin-right:8px;
}

.brand-divider{
    width:1px;
    height:25px;

    background:rgba(255,255,255,.3);

    margin-right:10px;
}

.brand-name{
    color:white;
}


/* NAV LINKS */

.nav-menu{
    display:flex;
    align-items:center;
    gap:5px;

    list-style:none;
}

.nav-menu li{
    list-style:none;
}

.nav-menu a{
    color:#e8efff;

    font-size:14px;
    font-weight:600;

    padding:10px 13px;

    border-radius:8px;

    transition:.25s;
}

.nav-menu a:hover{
    color:#ffd34e;
    background:rgba(255,255,255,.07);
}


/* REGISTER BUTTON */

.nav-register{
    background:#ffd34e !important;
    color:#071a3d !important;

    padding:10px 17px !important;

    font-weight:800 !important;
}

.nav-register:hover{
    background:#ffe17a !important;
    transform:translateY(-1px);
}


/* HAMBURGER */

.menu-toggle
