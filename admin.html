<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QCO Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      min-height: 100vh;
    }

    .header {
      background: #0757b8;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
    }

    .header p {
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.9;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      color: #0757b8;
      margin-bottom: 20px;
      font-size: 21px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5e0;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #0757b8;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn,
    .add-btn {
      width: 100%;
      background: #0757b8;
      color: white;
      margin-top: 20px;
    }

    .login-btn:hover,
    .add-btn:hover {
      background: #06458f;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      margin-top: 10px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .error {
      color: #dc3545;
    }

    .success {
      color: #198754;
    }

    #adminPanel {
      display: none;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top-row h2 {
      margin: 0;
    }

    .certificate-box {
      border: 1px solid #e0e5eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafcff;
    }

    .certificate-box strong {
      color: #0757b8;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    @media (max-width: 500px) {
      .container {
        width: 94%;
      }

      .card {
        padding: 20px;
      }

      .top-row {
        flex-direction: column;
        align-items: stretch;
      }

      .logout-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>QCO Admin Panel</h1>
    <p>Certificate Management System</p>
  </div>

  <div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginBox">

      <h2>Admin Login</h2>

      <label for="adminPassword">Admin Password</label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Enter admin password"
      >

      <button class="login-btn" onclick="adminLogin()">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel">

      <div class="card">

        <div class="top-row">
          <h2>Add Certificate</h2>

          <button class="logout-btn" onclick="logout()">
            Logout
          </button>
        </div>

        <form id="certificateForm">

          <label for="certificateId">
            Certificate ID
          </label>

          <input
            type="text"
            id="certificateId"
            placeholder="Example: QCO-GKC-2026-0001"
            required
          >


          <label for="participantName">
            Participant Name
          </label>

          <input
            type="text"
            id="participantName"
            placeholder="Enter participant name"
            required
          >


          <label for="eventName">
            Event Name
          </label>

          <input
            type="text"
            id="eventName"
            placeholder="Example: QCO National GK Championship 2026"
            required
          >


          <label for="achievement">
            Achievement / Position
          </label>

          <input
            type="text"
            id="achievement"
            placeholder="Example: Champion / Participant / 2nd Position"
            required
          >


          <label for="studentClass">
            Class
          </label>

          <input
            type="text"
            id="studentClass"
            placeholder="Example: Class VII"
          >


          <label for="institution">
            Institution
          </label>

          <input
            type="text"
            id="institution"
            placeholder="Enter institution name"
          >


          <label for="issueDate">
            Issue Date
          </label>

          <input
            type="date"
            id="issueDate"
            required
          >


          <label for="status">
            Certificate Status
          </label>

          <select id="status">
            <option value="Verified">Verified</option>
            <option value="Active">Active</option>
            <option value="Revoked">Revoked</option>
          </select>


          <label for="certificateUrl">
            Certificate URL
          </label>

          <input
            type="url"
            id="certificateUrl"
            placeholder="Optional certificate link"
          >


          <button
            type="submit"
            class="add-btn"
          >
            + Add Certificate
          </button>

        </form>

        <div id="addMessage" class="message"></div>

      </div>


      <!-- CERTIFICATE LIST -->

      <div class="card">

        <h2>Saved Certificates</h2>

        <div id="certificateList">
          <div class="empty">
            No certificates added yet.
          </div>
        </div>

      </div>

    </div>

  </div>


  <script>

    /*
      QCO ADMIN SYSTEM

      Important:
      This version uses browser LocalStorage
      because Firebase is not being used.

      Certificates are stored in this browser.
    */


    const ADMIN_PASSWORD = "imranqco133";


    // Login
    function adminLogin() {

      const password =
        document.getElementById("adminPassword").value;

      const message =
        document.getElementById("loginMessage");


      if (password === ADMIN_PASSWORD) {

        sessionStorage.setItem(
          "qcoAdminLoggedIn",
          "true"
        );

        document.getElementById("loginBox").style.display =
          "none";

        document.getElementById("adminPanel").style.display =
          "block";

        message.textContent = "";

        loadCertificates();

      } else {

        message.textContent =
          "Incorrect admin password.";

        message.className =
          "message error";

      }
    }


    // Check login
    function checkLogin() {

      const loggedIn =
        sessionStorage.getItem("qcoAdminLoggedIn");


      if (loggedIn === "true") {

        document.getElementById("loginBox").style.display =
          "none";

        document.getElementById("adminPanel").style.display =
          "block";

        loadCertificates();

      }
    }


    // Logout
    function logout() {

      sessionStorage.removeItem(
        "qcoAdminLoggedIn"
      );

      location.reload();
    }


    // Get certificates
    function getCertificates() {

      return JSON.parse(
        localStorage.getItem("qcoCertificates") || "[]"
      );

    }


    // Save certificates
    function saveCertificates(certificates) {

      localStorage.setItem(
        "qcoCertificates",
        JSON.stringify(certificates)
      );

    }


    // Add certificate
    document
      .getElementById("certificateForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();


        const certificate = {

          id:
            document.getElementById("certificateId")
              .value
              .trim(),

          name:
            document.getElementById("participantName")
              .value
              .trim(),

          event:
            document.getElementById("eventName")
              .value
              .trim(),

          achievement:
            document.getElementById("achievement")
              .value
              .trim(),

          className:
            document.getElementById("studentClass")
              .value
              .trim(),

          institution:
            document.getElementById("institution")
              .value
              .trim(),

          issueDate:
            document.getElementById("issueDate")
              .value,

          status:
            document.getElementById("status")
              .value,

          certificateUrl:
            document.getElementById("certificateUrl")
              .value
              .trim()

        };


        const certificates =
          getCertificates();


        // Check duplicate ID
        const exists =
          certificates.some(
            cert =>
              cert.id.toLowerCase() ===
              certificate.id.toLowerCase()
          );


        if (exists) {

          showAddMessage(
            "This Certificate ID already exists.",
            "error"
          );

          return;
        }


        certificates.push(certificate);

        saveCertificates(certificates);


        showAddMessage(
          "Certificate added successfully!",
          "success"
        );


        document
          .getElementById("certificateForm")
          .reset();


        loadCertificates();

      });


    // Display certificates
    function loadCertificates() {

      const certificates =
        getCertificates();

      const list =
        document.getElementById("certificateList");


      if (certificates.length === 0) {

        list.innerHTML =
          '<div class="empty">No certificates added yet.</div>';

        return;
      }


      list.innerHTML = "";


      certificates.forEach((cert, index) => {

        const box =
          document.createElement("div");

        box.className =
          "certificate-box";


        box.innerHTML = `

          <strong>${escapeHTML(cert.id)}</strong>

          <p>
            <b>Name:</b>
            ${escapeHTML(cert.name)}
          </p>

          <p>
            <b>Event:</b>
            ${escapeHTML(cert.event)}
          </p>

          <p>
            <b>Achievement:</b>
            ${escapeHTML(cert.achievement)}
          </p>

          <p>
            <b>Status:</b>
            ${escapeHTML(cert.status)}
          </p>

          <button
            style="margin-top:10px;background:#dc3545;color:white;"
            onclick="deleteCertificate(${index})"
          >
            Delete
          </button>

        `;


        list.appendChild(box);

      });

    }


    // Delete certificate
    function deleteCertificate(index) {

      if (
        !confirm(
          "Are you sure you want to delete this certificate?"
        )
      ) {
        return;
      }


      const certificates =
        getCertificates();


      certificates.splice(index, 1);


      saveCertificates(certificates);

      loadCertificates();

    }


    // Message
    function showAddMessage(
      text,
      type
    ) {

      const message =
        document.getElementById("addMessage");

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // Prevent HTML injection in certificate display
    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // Start
    checkLogin();

  </script>

</body>
  </html>
