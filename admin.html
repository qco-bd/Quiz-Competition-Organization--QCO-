<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QCO Admin | Certificate Management</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f3f6fb;
  color:#172033;
}

.header{
  background:#0757b8;
  color:white;
  padding:20px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header h1{
  font-size:25px;
}

.header p{
  margin-top:5px;
  font-size:13px;
  opacity:.9;
}

.container{
  width:94%;
  max-width:900px;
  margin:30px auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  margin-bottom:22px;
  box-shadow:0 6px 25px rgba(0,0,0,.07);
}

.card h2{
  color:#0757b8;
  margin-bottom:20px;
  font-size:21px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:14px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd6e2;
  border-radius:8px;
  outline:none;
  font-size:15px;
}

input:focus,
select:focus{
  border-color:#0757b8;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.primary{
  width:100%;
  margin-top:20px;
  background:#0757b8;
  color:white;
}

.primary:hover{
  background:#06458f;
}

.secondary{
  background:#eef4fb;
  color:#0757b8;
}

.danger{
  background:#dc3545;
  color:white;
}

.warning{
  background:#ffc107;
  color:#222;
}

.success{
  background:#198754;
  color:white;
}

.login-box{
  max-width:450px;
  margin:70px auto;
}

.message{
  margin-top:14px;
  text-align:center;
  font-weight:bold;
}

.error{
  color:#dc3545;
}

.success-text{
  color:#198754;
}

#adminPanel{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.logout{
  background:#dc3545;
  color:white;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 18px;
}

.full{
  grid-column:1/-1;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.form-buttons button{
  flex:1;
}

.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  flex:1;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:20px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  color:#0757b8;
}

.stat-label{
  margin-top:5px;
  color:#687386;
  font-size:13px;
}

.certificate{
  border:1px solid #e0e6ed;
  border-radius:12px;
  padding:18px;
  margin-bottom:14px;
  background:#fbfdff;
}

.certificate-id{
  color:#0757b8;
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}

.detail{
  font-size:14px;
  margin:5px 0;
  color:#566174;
}

.detail strong{
  color:#222;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

.status{
  display:inline-block;
  padding:4px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.status-verified{
  background:#d9f5e5;
  color:#198754;
}

.status-active{
  background:#e0efff;
  color:#0757b8;
}

.status-revoked{
  background:#ffe1e4;
  color:#dc3545;
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

.hidden{
  display:none;
}

@media(max-width:650px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .topbar{
    align-items:stretch;
    flex-direction:column;
  }

  .search-box{
    flex-direction:column;
  }

  .form-buttons{
    flex-direction:column;
  }

}

</style>
</head>

<body>


<div class="header">

  <h1>QCO Admin Panel</h1>

  <p>
    Certificate Management System
  </p>

</div>


<!-- LOGIN -->

<div class="container" id="loginSection">

  <div class="card login-box">

    <h2>Admin Login</h2>

    <label>
      Admin Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter admin password"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Login
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>

</div>


<!-- ADMIN -->

<div
  class="container"
  id="adminPanel"
>

  <div class="topbar">

    <div>
      <h2>Certificate Management</h2>
      <p style="color:#687386;font-size:13px;">
        Manage QCO certificates
      </p>
    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div
        class="stat-number"
        id="totalCount"
      >
        0
      </div>

      <div class="stat-label">
        Total Certificates
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="verifiedCount"
      >
        0
      </div>

      <div class="stat-label">
        Verified
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="revokedCount"
      >
        0
      </div>

      <div class="stat-label">
        Revoked
      </div>

    </div>

  </div>


  <!-- ADD / EDIT -->

  <div class="card">

    <h2 id="formTitle">
      Add New Certificate
    </h2>


    <form id="certificateForm">

      <div class="form-grid">


        <div>

          <label>
            Certificate ID
          </label>

          <input
            type="text"
            id="certificateId"
            placeholder="QCO-GKC-2026-0001"
            required
          >

        </div>


        <div>

          <label>
            Participant Name
          </label>

          <input
            type="text"
            id="name"
            placeholder="Participant name"
            required
          >

        </div>


        <div>

          <label>
            Event Name
          </label>

          <input
            type="text"
            id="event"
            placeholder="Event name"
            required
          >

        </div>


        <div>

          <label>
            Achievement / Position
          </label>

          <input
            type="text"
            id="achievement"
            placeholder="Champion / Participant / 2nd Position"
            required
          >

        </div>


        <div>

          <label>
            Class
          </label>

          <input
            type="text"
            id="className"
            placeholder="Class VII"
          >

        </div>


        <div>

          <label>
            Institution
          </label>

          <input
            type="text"
            id="institution"
            placeholder="Institution name"
          >

        </div>


        <div>

          <label>
            Issue Date
          </label>

          <input
            type="date"
            id="issueDate"
            required
          >

        </div>


        <div>

          <label>
            Status
          </label>

          <select id="status">

            <option value="Verified">
              Verified
            </option>

            <option value="Active">
              Active
            </option>

            <option value="Revoked">
              Revoked
            </option>

          </select>

        </div>


        <div class="full">

          <label>
            Certificate URL
          </label>

          <input
            type="url"
            id="certificateUrl"
            placeholder="Optional certificate link"
          >

        </div>

      </div>


      <div class="form-buttons">

        <button
          type="submit"
          class="primary"
          id="saveButton"
        >
          + Add Certificate
        </button>

        <button
          type="button"
          class="secondary hidden"
          id="cancelButton"
          onclick="cancelEdit()"
        >
          Cancel Edit
        </button>

      </div>

    </form>


    <div
      id="formMessage"
      class="message"
    ></div>

  </div>


  <!-- SEARCH -->

  <div class="card">

    <h2>
      Search Certificates
    </h2>

    <div class="search-box">

      <input
        type="text"
        id="search"
        placeholder="Search by ID or participant name"
        oninput="loadCertificates()"
      >

      <button
        class="secondary"
        onclick="clearSearch()"
      >
        Clear
      </button>

    </div>

  </div>


  <!-- LIST -->

  <div class="card">

    <h2>
      Certificate List
    </h2>

    <div id="certificateList"></div>

  </div>

</div>


<script>


/* =========================
   QCO ADMIN CONFIG
========================= */

const ADMIN_PASSWORD = "imranqco133";

let editingIndex = -1;


/* =========================
   LOGIN
========================= */

function login(){

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");


  if(password === ADMIN_PASSWORD){

    sessionStorage.setItem(
      "qcoAdminLoggedIn",
      "true"
    );

    showAdmin();

  }else{

    message.textContent =
      "Incorrect admin password.";

    message.className =
      "message error";

  }

}


function showAdmin(){

  document.getElementById("loginSection")
    .style.display = "none";

  document.getElementById("adminPanel")
    .style.display = "block";

  loadCertificates();

}


function logout(){

  sessionStorage.removeItem(
    "qcoAdminLoggedIn"
  );

  location.reload();

}


/* =========================
   DATA
========================= */

function getCertificates(){

  return JSON.parse(
    localStorage.getItem(
      "qcoCertificates"
    ) || "[]"
  );

}


function saveCertificates(data){

  localStorage.setItem(
    "qcoCertificates",
    JSON.stringify(data)
  );

}


/* =========================
   AUTO ID
========================= */

function generateCertificateID(){

  const certificates =
    getCertificates();

  let number =
    certificates.length + 1;

  let id;

  do{

    id =
      "QCO-CERT-2026-" +
      String(number).padStart(4,"0");

    number++;

  }while(
    certificates.some(
      cert =>
        cert.id.toLowerCase() ===
        id.toLowerCase()
    )
  );

  return id;

}


/* =========================
   FORM SUBMIT
========================= */

document
  .getElementById("certificateForm")
  .addEventListener(
    "submit",
    function(e){

      e.preventDefault();


      const certificates =
        getCertificates();


      const certificate = {

        id:
          document
            .getElementById("certificateId")
            .value.trim(),

        name:
          document
            .getElementById("name")
            .value.trim(),

        event:
          document
            .getElementById("event")
            .value.trim(),

        achievement:
          document
            .getElementById("achievement")
            .value.trim(),

        className:
          document
            .getElementById("className")
            .value.trim(),

        institution:
          document
            .getElementById("institution")
            .value.trim(),

        issueDate:
          document
            .getElementById("issueDate")
            .value,

        status:
          document
            .getElementById("status")
            .value,

        certificateUrl:
          document
            .getElementById("certificateUrl")
            .value.trim()

      };


      /* EDIT */

      if(editingIndex !== -1){

        const duplicate =
          certificates.some(
            (cert,index) =>
              index !== editingIndex &&
              cert.id.toLowerCase() ===
              certificate.id.toLowerCase()
          );


        if(duplicate){

          showMessage(
            "Certificate ID already exists.",
            "error"
          );

          return;

        }


        certificates[editingIndex] =
          certificate;


        saveCertificates(certificates);

        showMessage(
          "Certificate updated successfully!",
          "success-text"
        );

        cancelEdit();

        loadCertificates();

        return;

      }


      /* ADD */

      const duplicate =
        certificates.some(
          cert =>
            cert.id.toLowerCase() ===
            certificate.id.toLowerCase()
        );


      if(duplicate){

        showMessage(
          "Certificate ID already exists.",
          "error"
        );

        return;

      }


      certificates.push(certificate);

      saveCertificates(certificates);


      showMessage(
        "Certificate added successfully!",
        "success-text"
      );


      document
        .getElementById("certificateForm")
        .reset();


      loadCertificates();

    }
  );


/* =========================
   EDIT
========================= */

function editCertificate(index){

  const certificates =
    getCertificates();

  const cert =
    certificates[index];


  document.getElementById("certificateId")
    .value = cert.id;

  document.getElementById("name")
    .value = cert.name;

  document.getElementById("event")
    .value = cert.event;

  document.getElementById("achievement")
    .value = cert.achievement;

  document.getElementById("className")
    .value = cert.className || "";

  document.getElementById("institution")
    .value = cert.institution || "";

  document.getElementById("issueDate")
    .value = cert.issueDate || "";

  document.getElementById("status")
    .value = cert.status || "Verified";

  document.getElementById("certificateUrl")
    .value = cert.certificateUrl || "";


  editingIndex = index;


  document.getElementById("formTitle")
    .textContent = "Edit Certificate";

  document.getElementById("saveButton")
    .textContent = "Save Changes";

  document.getElementById("cancelButton")
    .classList.remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  editingIndex = -1;

  document
    .getElementById("certificateForm")
    .reset();

  document.getElementById("formTitle")
    .textContent = "Add New Certificate";

  document.getElementById("saveButton")
    .textContent = "+ Add Certificate";

  document.getElementById("cancelButton")
    .classList.add("hidden");

}


/* =========================
   DELETE
========================= */

function deleteCertificate(index){

  const certificates =
    getCertificates();

  const cert =
    certificates[index];


  const confirmDelete =
    confirm(
      "Delete certificate " +
      cert.id +
      "?"
    );


  if(!confirmDelete){
    return;
  }


  certificates.splice(index,1);

  saveCertificates(certificates);

  loadCertificates();

}


/* =========================
   LOAD
========================= */

function loadCertificates(){

  const certificates =
    getCertificates();

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    certificates.filter(cert =>

      cert.id
        .toLowerCase()
        .includes(search)

      ||

      cert.name
        .toLowerCase()
        .includes(search)

    );


  updateStats(certificates);


  const list =
    document.getElementById(
      "certificateList"
    );


  if(filtered.length === 0){

    list.innerHTML =
      `<div class="empty">
        No certificates found.
      </div>`;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(cert => {

    const realIndex =
      certificates.indexOf(cert);


    const box =
      document.createElement("div");

    box.className =
      "certificate";


    let statusClass =
      "status-active";


    if(cert.status === "Verified"){
      statusClass =
        "status-verified";
    }


    if(cert.status === "Revoked"){
      statusClass =
        "status-revoked";
    }


    box.innerHTML = `

      <div class="certificate-id">
        ${escapeHTML(cert.id)}
      </div>

      <div class="detail">
        <strong>Name:</strong>
        ${escapeHTML(cert.name)}
      </div>

      <div class="detail">
        <strong>Event:</strong>
        ${escapeHTML(cert.event)}
      </div>

      <div class="detail">
        <strong>Achievement:</strong>
        ${escapeHTML(cert.achievement)}
      </div>

      <div class="detail">
        <strong>Institution:</strong>
        ${escapeHTML(
          cert.institution || "N/A"
        )}
      </div>

      <div class="detail">
        <strong>Issue Date:</strong>
        ${escapeHTML(
          cert.issueDate || "N/A"
        )}
      </div>

      <div class="detail">
        <strong>Status:</strong>
        <span class="status ${statusClass}">
          ${escapeHTML(cert.status)}
        </span>
      </div>

      <div class="actions">

        <button
          class="warning"
          onclick="editCertificate(${realIndex})"
        >
          Edit
        </button>

        <button
          class="danger"
          onclick="deleteCertificate(${realIndex})"
        >
          Delete
        </button>

        ${
          cert.certificateUrl
          ?
          `
          <button
            class="success"
            onclick="openCertificate('${escapeJS(cert.certificateUrl)}')"
          >
            View
          </button>
          `
          :
          ""
        }

      </div>

    `;


    list.appendChild(box);

  });

}


/* =========================
   STATS
========================= */

function updateStats(certificates){

  document.getElementById("totalCount")
    .textContent =
      certificates.length;


  document.getElementById("verifiedCount")
    .textContent =
      certificates.filter(
        cert =>
          cert.status === "Verified"
      ).length;


  document.getElementById("revokedCount")
    .textContent =
      certificates.filter(
        cert =>
          cert.status === "Revoked"
      ).length;

}


/* =========================
   SEARCH CLEAR
========================= */

function clearSearch(){

  document.getElementById("search")
    .value = "";

  loadCertificates();

}


/* =========================
   AUTO ID BUTTON HELPER
========================= */

document
  .getElementById("certificateId")
  .addEventListener(
    "dblclick",
    function(){

      if(!this.value){

        this.value =
          generateCertificateID();

      }

    }
  );


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "formMessage"
    );

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJS(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


function openCertificate(url){

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================
   START
========================= */

if(
  sessionStorage.getItem(
    "qcoAdminLoggedIn"
  ) === "true"
){

  showAdmin();

}

</script>

</body>
      </html>
